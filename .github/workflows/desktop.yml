name: desktop

# Instalador do Jarvis para Windows (Tauri). Compila a cada mudanca em
# app/desktop e publica um release nas tags desktop-v*.
on:
  push:
    branches: ['**']
    tags: ['desktop-v*']
    # (nas tags, o GitHub ignora o filtro de caminhos e sempre compila)
    paths: ['app/desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['app/desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/desktop/src-tauri
      - run: npm ci
      - run: npm run icons
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows
          path: |
            app/desktop/src-tauri/target/release/bundle/msi/*.msi
            app/desktop/src-tauri/target/release/bundle/nsis/*.exe
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/desktop/src-tauri/target/release/bundle/msi/*.msi
            app/desktop/src-tauri/target/release/bundle/nsis/*.exe
