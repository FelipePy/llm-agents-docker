name: desktop

# Instaladores do Jarvis para Windows e Linux (Tauri). Compila a cada mudanca em
# app/desktop e publica um release nas tags desktop-v*.
on:
  push:
    branches: ['**']
    tags: ['desktop-v*']
    # (nas tags, o GitHub ignora o filtro de caminhos e sempre compila)
    paths: ['app/desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['app/desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: jarvis-windows
            bundles: |
              app/desktop/src-tauri/target/release/bundle/msi/*.msi
              app/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            name: jarvis-linux
            bundles: |
              app/desktop/src-tauri/target/release/bundle/deb/*.deb
              app/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/desktop/src-tauri
      - run: npm ci
      - run: npm run icons
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.bundles }}
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.bundles }}
