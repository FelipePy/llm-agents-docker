name: desktop

# Verificacoes (testes, tipos, build da web) em jobs paralelos e, so depois
# que todas passam, os instaladores do Jarvis para Windows e Linux (Tauri).
# - push em qualquer branch: instaladores como artefatos da execucao (um por tipo);
#   so quando o push muda app/desktop, VERSION ou este workflow (as verificacoes
#   rodam sempre; workflow_dispatch sempre constroi);
# - push na main: tambem publica um release do projeto (vX.Y.Z) com cada
#   instalador como um arquivo separado, com a versao no nome.
#
# Versao: o arquivo VERSION da raiz e a base. O primeiro release dela sai com
# esse numero; os seguintes, na mesma major.minor, sobem o patch sozinhos
# (1.3.0, 1.3.1, ...). Para um salto maior, edite o VERSION (ex.: 1.4.0).
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

# Dois pushes seguidos na main nao podem calcular a mesma versao.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Testes do servidor (node --test).
  server-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/server/package-lock.json
      - run: npm ci
      - run: npm test

  # Testes da interface (vitest).
  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm test

  # Checagem de tipos, uma parte da matriz por pacote.
  typecheck:
    strategy:
      fail-fast: false
      matrix:
        package: [server, web]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  # Build da interface (vite).
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run build

  # Testes do worker de voz (biblioteca padrao + numpy, sem o requirements.txt inteiro).
  voice-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'numpy>=1.24,<3'
      - run: python -m unittest discover -s app/voice/tests -t app/voice

  # Testes dos scripts (llm-agent ui, restart, remote control).
  scripts-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/server/package-lock.json
      - run: npm --prefix app/server ci
      - run: bash tests/ui.test.sh
      - run: bash tests/restart.test.sh
      - run: bash tests/remote-control.test.sh
      - run: bash tests/container-name.test.sh
      - run: bash tests/voice-setup.test.sh

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      desktop: ${{ steps.changes.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # O build desktop so roda se o push mexeu no app desktop, no VERSION ou
      # neste workflow. Sem um "antes" confiavel (branch nova, force push),
      # compara com a main; sem base nenhuma, constroi.
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" != "push" ]; then
            echo "desktop=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          base=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "desktop=true" >>"$GITHUB_OUTPUT"
            echo "Sem base para comparar: build desktop roda." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD | grep -E '^(app/desktop/|VERSION$|\.github/workflows/desktop\.yml$)' || true)"
          if [ -n "$changed" ]; then
            echo "desktop=true" >>"$GITHUB_OUTPUT"
            { echo "Build desktop roda por causa de:"; echo "$changed" | sed 's/^/- /'; } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "desktop=false" >>"$GITHUB_OUTPUT"
            echo "Nada em app/desktop, VERSION ou no workflow: build desktop pulado." >>"$GITHUB_STEP_SUMMARY"
          fi
      - id: v
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "version=$base" >>"$GITHUB_OUTPUT"
            echo "release=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          existing="$(git tag --points-at HEAD -l 'v*' | sed 's/^v//' | sort -V | tail -1)"
          if [ -n "$existing" ]; then
            version="$existing"                      # execucao repetida do mesmo commit
          elif ! git rev-parse -q --verify "refs/tags/v$base" >/dev/null; then
            version="$base"                          # primeiro release desta base
          else
            mm="${base%.*}"
            last="$(git tag -l "v$mm.*" | sed 's/^v//' | sort -V | tail -1)"
            version="$mm.$(( ${last##*.} + 1 ))"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "release=true" >>"$GITHUB_OUTPUT"
          echo "Versão: $version" >>"$GITHUB_STEP_SUMMARY"

  # Os instaladores so saem com todas as verificacoes verdes e se o app desktop
  # mudou. Pulado o build, o release (que depende dele) tambem e pulado.
  build:
    needs: [version, server-test, web-test, typecheck, web-build, voice-test, scripts-test]
    if: needs.version.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            first: jarvis-windows-exe
            first_path: app/desktop/src-tauri/target/release/bundle/nsis/*.exe
            second: jarvis-windows-msi
            second_path: app/desktop/src-tauri/target/release/bundle/msi/*.msi
          - os: ubuntu-22.04
            first: jarvis-linux-deb
            first_path: app/desktop/src-tauri/target/release/bundle/deb/*.deb
            second: jarvis-linux-appimage
            second_path: app/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/desktop/src-tauri
      - run: npm ci
      - run: node scripts/set-version.mjs ${{ needs.version.outputs.version }}
      - run: npm run icons
      - run: npm run build
      # Um artefato por instalador: baixa-se so o que quiser.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.first }}
          path: ${{ matrix.first_path }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.second }}
          path: ${{ matrix.second_path }}
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: jarvis-*
          merge-multiple: true
      - run: ls -la installers
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.version.outputs.version }}
          make_latest: true
          generate_release_notes: true
          body: |
            ## Instaladores do Jarvis (app desktop)
            Baixe só o do seu sistema, em **Assets** abaixo:

            | Sistema | Arquivo |
            | --- | --- |
            | Windows (recomendado) | `Jarvis_${{ needs.version.outputs.version }}_x64-setup.exe` |
            | Windows (MSI, para instalação gerenciada) | `Jarvis_${{ needs.version.outputs.version }}_x64_en-US.msi` |
            | Ubuntu / Debian | `Jarvis_${{ needs.version.outputs.version }}_amd64.deb` |
            | Outras distribuições Linux | `Jarvis_${{ needs.version.outputs.version }}_amd64.AppImage` |

            O app usa o `llm-agent` instalado no WSL (Windows) ou no próprio Linux: rode `./install.sh` no repositório antes.
          files: installers/*
