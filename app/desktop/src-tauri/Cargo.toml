[package]
name = "jarvis-desktop"
version = "1.3.0"
description = "Jarvis: app desktop do llm-agent (Windows)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# A mesma versao que o Tauri 2 usa (para os tipos baterem).
webkit2gtk = "2"

[profile.release]
strip = true
lto = true
