[package]
name = "jarvis-desktop"
version = "0.1.0"
description = "Jarvis: app desktop do llm-agent (Windows)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde_json = "1"

[profile.release]
strip = true
lto = true
