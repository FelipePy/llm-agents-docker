<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Jarvis</title>
    <style>
      :root { color-scheme: dark; font-family: 'Segoe UI', system-ui, sans-serif; }
      body { margin: 0; height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at center, #14110a 0%, #05060a 70%); color: #e8e2d0; }
      .box { text-align: center; max-width: 640px; padding: 24px; }
      .ring { width: 120px; height: 120px; margin: 0 auto 28px; border-radius: 50%; background: #000; box-shadow: 0 0 0 10px #2a1f08, 0 0 40px 16px rgba(255, 191, 60, 0.45); animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 50% { box-shadow: 0 0 0 12px #3a2a0a, 0 0 60px 24px rgba(255, 191, 60, 0.7); } }
      h1 { font-weight: 300; letter-spacing: 0.3em; text-transform: uppercase; color: #ffc94a; margin: 0 0 8px; }
      #status { color: #9a937f; }
      #error { display: none; margin-top: 20px; text-align: left; background: #1a1410; border: 1px solid #5a3b16; border-radius: 10px; padding: 14px 16px; }
      #error pre { white-space: pre-wrap; font-size: 12px; color: #d9b98a; max-height: 240px; overflow: auto; }
      code { color: #ffd98a; }
      button { margin-top: 12px; font: inherit; color: #05060a; background: #ffc94a; border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
      button:disabled { opacity: 0.45; cursor: default; }
      button.ghost { color: #e8e2d0; background: transparent; border: 1px solid #5a4a26; }
      /* Lista do que falta instalar (aprovacao do usuario). */
      body.setup { place-items: start center; overflow: auto; }
      body.setup .box { max-width: 760px; padding-top: 32px; }
      body.setup .ring { width: 64px; height: 64px; margin-bottom: 16px; }
      #setup { display: none; margin-top: 18px; text-align: left; }
      #setup .intro { color: #b8b09a; margin: 0 0 14px; }
      .item { display: grid; grid-template-columns: 26px 1fr; gap: 4px 10px; background: #120f0a; border: 1px solid #3a2c12; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
      .item.ok { border-color: #22301d; opacity: 0.75; }
      .item input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: #ffc94a; }
      .item .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
      .item .title { color: #ffd98a; font-weight: 600; }
      .item .found { color: #7f7866; font-size: 12px; }
      .badge { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 1px 8px; background: #3a2a0a; color: #ffc94a; }
      .badge.ok { background: #1c2c18; color: #9fd28a; }
      .badge.warn { background: #3a1a12; color: #f0a07a; }
      .item .why, .item .action { grid-column: 2; font-size: 13px; color: #b8b09a; }
      .item .action { color: #d9cfb5; }
      .item .action b { color: #9a937f; font-weight: 400; }
      .item .progress { grid-column: 2; font-size: 13px; color: #ffc94a; display: none; }
      .item .progress.ok { color: #9fd28a; }
      .item .progress.fail { color: #f0a07a; white-space: pre-wrap; }
      #setup .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
      #setup-log { margin-top: 12px; font-size: 12px; color: #7f7866; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.2em; }
      #setup-notice { display: none; margin-top: 14px; background: #1a1410; border: 1px solid #5a3b16; border-radius: 10px; padding: 12px 14px; color: #e8d6b0; white-space: pre-wrap; }
      @media (max-width: 520px) { body.setup .box { padding: 16px; } }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="ring"></div>
      <h1>Jarvis</h1>
      <div id="status">Iniciando o servidor…</div>
      <div id="error">
        <strong>Não consegui iniciar a interface.</strong>
        <pre id="detail"></pre>
        <p>Para ver o erro completo, rode no terminal (no Windows, no do WSL): <code>llm-agent ui</code>. O registro do servidor fica em <code>~/.config/llm-agent/ui/server.log</code>.</p>
        <button id="retry">Tentar de novo</button>
      </div>
      <div id="setup">
        <p class="intro" id="setup-intro"></p>
        <div id="setup-items"></div>
        <div class="buttons">
          <button id="setup-install">Instalar selecionados</button>
          <button id="setup-skip" class="ghost">Agora não</button>
          <button id="setup-retry" class="ghost" style="display: none">Conferir de novo</button>
        </div>
        <div id="setup-log"></div>
        <div id="setup-notice"></div>
      </div>
    </div>
    <script>
      // Chamadas pelo app (Rust) via eval.
      window.setStatus = (text) => (document.getElementById('status').textContent = text);
      window.showError = (text) => {
        document.getElementById('setup').style.display = 'none';
        document.getElementById('status').textContent = '';
        document.getElementById('detail').textContent = text;
        document.getElementById('error').style.display = 'block';
      };

      // Lista de dependencias: o app chama showSetup(itens, reparar) e, durante a
      // instalacao, setupStep / setupLog / setupDone. Nada e instalado sem o clique.
      const $ = (id) => document.getElementById(id);
      const BADGES = {
        ok: ['Instalado', 'ok'],
        missing: ['Falta', ''],
        outdated: ['Versão antiga', ''],
        manual: ['Precisa de você', 'warn'],
        relogin: ['Falta entrar de novo', 'warn'],
      };
      let rows = {};
      let busy = false;
      const el = (tag, cls, text) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text) e.textContent = text;
        return e;
      };
      const selected = () => Object.entries(rows).filter(([, r]) => r.box && r.box.checked && !r.box.disabled).map(([id]) => id);
      const refresh = () => {
        const n = selected().length;
        $('setup-install').disabled = busy || n === 0;
        $('setup-install').textContent = n ? `Instalar selecionados (${n})` : 'Instalar selecionados';
        $('setup-skip').disabled = busy;
      };
      window.showSetup = (items, repair) => {
        busy = false;
        rows = {};
        document.body.classList.add('setup');
        $('error').style.display = 'none';
        $('status').textContent = '';
        $('setup-notice').style.display = 'none';
        $('setup-log').textContent = '';
        $('setup-retry').style.display = 'none';
        const pending = items.filter((i) => i.state !== 'ok');
        $('setup-intro').textContent = pending.length
          ? 'Para o Jarvis funcionar falta o que está abaixo. Veja o motivo de cada item e o que será feito; só instalo o que você marcar.'
          : 'Tudo o que o Jarvis precisa já está instalado. Marque um item para instalar de novo (reparar ou atualizar).';
        $('setup-skip').textContent = repair || !pending.length ? 'Voltar ao Jarvis' : 'Agora não';
        const list = $('setup-items');
        list.replaceChildren();
        for (const item of items) {
          const row = el('div', `item ${item.state === 'ok' ? 'ok' : ''}`);
          const installable = item.state !== 'manual' && item.state !== 'relogin';
          let box = null;
          if (installable) {
            box = el('input');
            box.type = 'checkbox';
            box.checked = item.state !== 'ok';
            box.title = item.state === 'ok' ? 'Instalar de novo' : 'Instalar';
            box.addEventListener('change', refresh);
            row.append(box);
          } else {
            row.append(el('span'));
          }
          const head = el('div', 'head');
          const [label, cls] = BADGES[item.state] || [item.state, ''];
          head.append(el('span', 'title', item.title), el('span', `badge ${cls}`, label));
          if (item.found) head.append(el('span', 'found', item.found));
          row.append(head, el('div', 'why', item.why));
          if (item.action) {
            const action = el('div', 'action', item.action);
            if (item.size) action.append(el('b', '', ` (${item.size})`));
            row.append(action);
          }
          const progress = el('div', 'progress');
          row.append(progress);
          list.append(row);
          rows[item.id] = { box, progress };
        }
        $('setup').style.display = 'block';
        refresh();
      };
      window.setupStep = (step) => {
        const r = rows[step.id];
        if (!r) return;
        r.progress.style.display = 'block';
        r.progress.className = `progress ${step.state === 'start' ? '' : step.state}`;
        r.progress.textContent = step.state === 'start' ? 'Instalando…' : step.state === 'ok' ? 'Pronto.' : `Falhou: ${step.message || 'veja o registro abaixo.'}`;
      };
      window.setupLog = (text) => ($('setup-log').textContent = text);
      window.setupDone = (done) => {
        busy = false;
        refresh();
        const notice = $('setup-notice');
        const say = (text) => {
          notice.textContent = text;
          notice.style.display = 'block';
        };
        if (done.error) {
          say(`A instalação parou neste erro:\n${done.error}\n\nO que já foi instalado continua; corrija o problema (o registro do passo está acima) e confira de novo para continuar de onde parou.`);
          $('setup-retry').style.display = '';
        } else if (done.restart === 'windows') {
          say('O WSL foi ligado: reinicie o computador e abra o Jarvis de novo para continuar a instalação.');
        } else if (done.restart === 'logout') {
          say('Seu usuário entrou no grupo docker, mas isso só vale numa sessão nova: saia e entre de novo (ou reinicie o computador) e abra o Jarvis.');
          $('setup-skip').textContent = 'Abrir o Jarvis mesmo assim';
        } else {
          say('Tudo pronto. Iniciando o Jarvis…');
        }
      };
      $('setup-install').addEventListener('click', () => {
        const ids = selected();
        if (!ids.length) return;
        busy = true;
        refresh();
        $('setup-notice').style.display = 'none';
        $('setup-retry').style.display = 'none';
        for (const r of Object.values(rows)) if (r.box) r.box.disabled = true;
        window.__TAURI__.core.invoke('setup_install', { ids });
      });
      $('setup-skip').addEventListener('click', () => {
        document.body.classList.remove('setup');
        $('setup').style.display = 'none';
        window.setStatus('Iniciando o servidor…');
        window.__TAURI__.core.invoke('setup_skip');
      });
      $('setup-retry').addEventListener('click', () => {
        $('setup').style.display = 'none';
        document.body.classList.remove('setup');
        window.setStatus('Conferindo de novo…');
        window.__TAURI__.core.invoke('retry');
      });

      document.getElementById('retry').addEventListener('click', () => {
        document.getElementById('error').style.display = 'none';
        window.setStatus('Tentando de novo…');
        window.__TAURI__.core.invoke('retry');
      });
    </script>
  </body>
</html>
