services:
  codex:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/codex-safe:latest
    stdin_open: true
    tty: true
    working_dir: ${CODEX_WORKDIR:?set CODEX_WORKDIR to the project path}
    environment:
      COLORTERM: "${COLORTERM:-truecolor}"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SHELL: /usr/bin/zsh
      TERM: "${TERM:-xterm-256color}"
    volumes:
      - type: bind
        source: ${HOME}/.ssh
        target: /home/codex/.ssh
        read_only: true
      - type: bind
        source: ${HOME}/.config/gh
        target: /home/codex/.config/gh
        read_only: true
      - type: bind
        source: ${HOME}/.gitconfig
        target: /home/codex/.gitconfig
        read_only: true
      - type: bind
        source: ${HOME}/.codex
        target: /home/codex/.codex
        read_only: true
      - type: bind
        source: ${HOME}/.zshrc
        target: /home/codex/.zshrc
        read_only: true
      - type: bind
        source: ${HOME}/.nvm
        target: /home/codex/.nvm
        read_only: true
      - type: bind
        source: ${HOME}/.pyenv
        target: /home/codex/.pyenv
        read_only: true
      - type: bind
        source: ${CODEX_WORKDIR:?set CODEX_WORKDIR to the project path}
        target: ${CODEX_WORKDIR:?set CODEX_WORKDIR to the project path}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
