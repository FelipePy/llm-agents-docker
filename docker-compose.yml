services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: "${HOST_UID:-1000}"
        GID: "${HOST_GID:-1000}"
        CODEX_VERSION: "${CODEX_VERSION:-0.149.0}"
        CLAUDE_CODE_VERSION: "${CLAUDE_CODE_VERSION:-2.1.285}"
    image: local/llm-agent-safe:latest
    stdin_open: true
    tty: true
    working_dir: ${AGENT_WORKDIR:?set AGENT_WORKDIR to the project path}
    environment:
      # HOME fica em /home/agent (usuario "agent" do container). NUNCA aponte HOME para
      # ${HOME} do host: isso obriga a montar a home inteira e vaza os projetos
      # vizinhos para o agente.
      HOME: /home/agent
      COLORTERM: "${COLORTERM:-truecolor}"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SHELL: /usr/bin/zsh
      TERM: "${TERM:-xterm-256color}"
      # As versoes dos CLIs sao gerenciadas pela imagem (llm-agent oferece a
      # atualizacao); o npm global do container nao e gravavel pelo agente.
      DISABLE_AUTOUPDATER: "1"
    # Aqui ficam so os mounts obrigatorios. Os opcionais (ssh, gh, git, zsh,
    # toolchains) sao adicionados pelo script llm-agent apenas se existirem no host.
    volumes:
      # --- unico caminho gravavel e visivel do host: o projeto ---
      # Montado no mesmo caminho absoluto do host, para que host e container
      # compartilhem o historico de chats do projeto (~/.claude/projects/<caminho>).
      - type: bind
        source: ${AGENT_WORKDIR:?set AGENT_WORKDIR to the project path}
        target: ${AGENT_WORKDIR:?set AGENT_WORKDIR to the project path}
        read_only: false

      # --- credenciais e estado dos CLIs ---
      # create_host_path: false evita que o Docker crie diretorios de root no
      # lugar de arquivos/pastas ausentes (o Claude perderia login/tema).
      - type: bind
        source: ${HOST_HOME:?set HOST_HOME to your home directory}/.codex
        target: /home/agent/.codex
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ${HOST_HOME:?set HOST_HOME to your home directory}/.claude
        target: /home/agent/.claude
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ${HOST_HOME:?set HOST_HOME to your home directory}/.claude.json
        target: /home/agent/.claude.json
        read_only: false
        bind:
          create_host_path: false

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
